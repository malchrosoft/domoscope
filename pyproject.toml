[project]
name = "domoscope"
version = "0.1.0"
description = "Self-hosted LAN scanner and home-automation inventory: discover every connected device, keep a searchable registry, generate reports, and control supported devices locally."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Aymeric MALCHROWICZ", email = "aymeric.malchrowicz@malchrosoft.fr" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "cryptography>=43",
    "platformdirs>=4",
    "tinytuya>=1.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
domoscope = "domoscope.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domoscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
